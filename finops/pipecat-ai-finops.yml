description: >-
  FinOps view of building and operating Pipecat-based voice and multimodal
  agents. The Pipecat framework itself is free and open source (BSD 2-Clause),
  so direct framework cost is zero. Spend accrues in two places: (1) the
  third-party AI services and transports wired into a pipeline - STT, LLM, TTS,
  vision, and media/telephony vendors, each billed directly by the provider;
  and (2) optional Pipecat Cloud hosting, billed usage-based per active
  agent-minute by compute profile (agent-1x/2x/3x), with reserved-capacity
  discounts and per-minute add-ons for transport, recording, noise suppression,
  and telephony. Rates are not reconciled here.
notes: >-
  Pipecat Cloud per-minute rates and agent profiles change; verify against the
  Pipecat Cloud pricing page and calculator during reconciliation. The largest
  variable cost in most deployments is downstream inference (LLM tokens) and
  STT/TTS minutes billed by external vendors, not Pipecat.
