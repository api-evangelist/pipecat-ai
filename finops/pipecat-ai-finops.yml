meters:
- name: agent_active_minutes
  description: Minutes an agent runs actively on a Pipecat Cloud compute profile (agent-1x/2x/3x).
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - agent
  - profile
- name: agent_reserved_minutes
  description: Reserved-capacity agent-minutes billed at a discounted standby rate.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - agent
  - profile
- name: transport_participant_minutes
  description: WebRTC voice/video participant-minutes for media transport.
  unit: participant_minutes
  aggregation: sum
  dimensions:
  - account
  - transport
- name: recording_minutes
  description: Audio-only or audio-and-video recording minutes.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - recording_type
- name: noise_suppression_minutes
  description: Krisp VIVA noise-suppression minutes (free first 10k/mo, then per-minute).
  unit: minutes
  aggregation: sum
  dimensions:
  - account
- name: telephony_minutes
  description: SIP and PSTN telephony minutes.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - telephony_type
- name: external_service_usage
  description: Downstream STT/LLM/TTS/vision usage billed directly by third-party vendors, not by Pipecat.
  unit: varies
  aggregation: sum
  dimensions:
  - account
  - provider
  - service
principles:
- name: Visibility
  description: Track Pipecat Cloud agent-minutes per profile plus each integrated STT/LLM/TTS vendor's own billing exports; the framework itself is free.
- name: Allocation
  description: Tag agents and secret sets per workload/team and map both Pipecat Cloud and downstream vendor spend to cost centers.
- name: Optimization
  description: Right-size compute profiles (agent-1x vs 3x), use reserved capacity for steady load, pick efficient STT/LLM/TTS models, and self-host the OSS framework where Cloud hosting is not needed.
- name: Accountability
  description: Assign owners per agent/project; review per-minute Cloud spend and downstream inference costs monthly against budget.
