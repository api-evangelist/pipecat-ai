    type: GitHub
  description: >-
    Realtime media transport layer of the framework. Bidirectional audio, video, and data flow over Daily
    WebRTC, SmallWebRTC, LiveKit, FastAPI WebSocket server, and telephony serializers (Twilio, Telnyx,
    Plivo, Exotel). These are SDK transport classes, not a hosted public REST/WebSocket control API.
