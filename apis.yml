    type: GitHub
  description: >-
    Open-source (BSD 2-Clause) Python framework whose interface is the pipecat-ai library, not a REST
    API. Applications wire FrameProcessors into a Pipeline, where Frames carry audio, text, images, and
    control signals between pluggable AI Services (STT, LLM, TTS, vision) and client Transports.
